[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stic-emul"
version = "0.1.0"
description = "NN emulator for spatially coupled STiC inversions"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "netCDF4",
]

[project.optional-dependencies]
train = ["torch"]

[tool.setuptools]
packages = ["emulator"]
